<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>FestTime Chat</title>
  <link rel="stylesheet" href="chat.css?v=20260819-dm2" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <img src="festtime-logo.png" alt="FestTime" class="chat-logo" />
        <div>
          <h1 id="chatTitle">Chat del Festival</h1>
          <p id="meta"></p>
        </div>
      </div>
      <div class="actions">
        <button id="dmInboxBtn" class="ghost">Mis DMs</button>
        <button id="joinBtn" class="primary">Unirse al Chat</button>
        <button id="leaveBtn" class="danger" disabled>Abandonar el Chat</button>
      </div>
    </header>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="messages" class="messages"></section>

    <section id="dmInboxPanel" class="dm-inbox-panel hidden" aria-live="polite">
      <div class="dm-header">
        <strong>Conversaciones privadas</strong>
        <button id="dmInboxCloseBtn" type="button" class="ghost">Cerrar</button>
      </div>
      <section id="dmThreads" class="dm-threads"></section>
    </section>

    <section id="dmPanel" class="dm-panel hidden" aria-live="polite">
      <div class="dm-header">
        <strong id="dmTitle">Chat privado</strong>
        <button id="dmCloseBtn" type="button" class="ghost">Cerrar</button>
      </div>
      <section id="dmMessages" class="dm-messages"></section>
      <form id="dmComposer" class="dm-composer">
        <input id="dmMessageInput" type="text" maxlength="400" placeholder="Mensaje privado..." autocomplete="off" />
        <button type="submit" class="primary">Enviar DM</button>
      </form>
    </section>

    <section id="userActionSheet" class="user-action-sheet hidden" aria-live="polite">
      <div class="user-action-card">
        <strong id="userActionTitle">Usuario</strong>
        <button id="startDmBtn" type="button" class="primary">Iniciar chat privado</button>
        <button id="cancelUserActionBtn" type="button" class="ghost">Cancelar</button>
      </div>
    </section>

    <form id="composer" class="composer">
      <input id="messageInput" type="text" maxlength="400" placeholder="Escribe un mensaje..." autocomplete="off" />
      <button type="submit" class="primary">Enviar</button>
    </form>
  </main>

  <script src="chat.js?v=20260819-dm2"></script>
</body>
</html>
